<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Tasks · Viralway</title>
    <link rel="icon" type="image/png" href="/assets/img/viralway.png">
    <link rel="stylesheet" href="/assets/styles.css">
    <script type="module" src="/assets/shell.js"></script>
</head>
<body class="dashboard-grid">
    <script>(function(){var m=document.cookie.match(/\W?theme=(\w+)/);document.body.classList.add(m&&m[1]==='dark'?'dark':'light');})();</script>
    <aside class="sidebar">
        <a class="sidebar-logo" href="/">__LOGO__</a>
        __SIDEBAR_NAV__
    </aside>
    <header class="mobile-header">
        <a href="/" aria-label="Viralway">__LOGO_BADGE__</a>
        <div class="topbar-actions">__AUTH_ICON__</div>
    </header>
    <div class="main">
        <header class="topbar">
            <h1 id="page-title" class="page-title">Tasks</h1>
            <div class="topbar-actions">
                <button id="refresh-tasks" class="icon-circle" type="button" data-tooltip="Refresh" aria-label="Refresh">
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                </button>
                __THEME_TOGGLE__
            </div>
        </header>
        <main class="well-wrap">
            <div class="well-cap" aria-hidden="true"></div>
            <div class="well">
                <div class="page">
                    <section class="panel">
                        <div class="card-head"><h2 class="card-title">Schedules</h2><p class="card-description">Upcoming and recurring automation across every device.</p></div>
                        <div id="schedules" class="task-list loading-card"><span class="spinner" aria-hidden="true"></span>Loading schedules…</div>
                    </section>
                    <section class="panel">
                        <div class="card-head"><h2 class="card-title">Executions</h2><p class="card-description">Every run, newest first.</p></div>
                        <div id="executions" class="task-list loading-card"><span class="spinner" aria-hidden="true"></span>Loading executions…</div>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <nav class="mobile-tabbar" aria-label="Navigation">__TAB_NAV__</nav>
    <script type="module" src="/assets/tasks.js"></script>
</body>
</html>
